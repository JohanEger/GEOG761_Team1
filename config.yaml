# Shared project configuration.
# Read this from every notebook — never hardcode paths or parameters.

project: tonga-vessels

# Coordinate reference system.
# TGD2005 / Tonga Map Grid. Chosen over UTM because Tonga straddles the
# 174°W zone boundary: Tongatapu and Ha'apai fall in zone 1S, Vava'u in 2S.
# One grid for the whole archipelago. Metres.
crs: "EPSG:5887"

# Google Earth Engine
gee:
  project: "groupprojectgeog761"            # Cloud project with the EE API enabled
  collection: "projects/groupprojectgeog761/assets/tonga_psscene"
  # The collection MUST exist before ordering. Create it with:
  #   earthengine create collection projects/<project>/assets/tonga_psscene

# Planet ordering and delivery
planet:
  item_type: "PSScene"
  asset: "analytic_8b_sr_udm2"
  max_cloud_cover: 0.4
  # Reproject at order time so every scene shares one grid.
  # Nearest neighbour: small vessels are 1-3 pixels and bilinear smears the peak.
  reproject_epsg: 5887
  reproject_resolution: 3.0
  resampling: "nearest"
  # Delivery straight into the GEE collection above — no download, no re-upload.
  delivery: "google_earth_engine"
  # Planet recommends ~1000 assets per organisation per day on the default
  # service account. Split large orders across days.
  max_assets_per_day: 800

# Quota tracking (Basic Education & Research tier).
# GEE deliveries count against the monthly download allowance, so plan in area.
quota:
  monthly_km2: 3000            # 
  charged_on: "TBD"             # clipped area or full scene footprint? ask Planet
  dense_aoi: "nukualofa"       # daily coverage: method development, detection limit
  sampled_aoi_per_week: 3      # other harbours: enough for activity patterns

# Areas of interest (GeoJSON in aoi/, WGS84)
aoi:
  full: "tonga_full.geojson"
  harbours:
    - "nukualofa.geojson"
    - "neiafu.geojson"
    - "pangai.geojson"

# Paths for everything that is NOT imagery.
# Imagery lives in GEE; this is for labels, patches, models and outputs.
paths:
  data_root: "/content/drive/MyDrive/tonga-vessels-data"
  patches: "patches"           # exported candidate patches for labelling
  labels: "labels"
  reference: "reference"       # Maxar tiles, screenshots used for verification
  models: "models"
  outputs: "outputs"
  aoi_dir: "aoi"

# Preprocessing (runs server-side in Earth Engine)
preprocess:
  udm2_clear_band: "B8"     # confirm band naming on the delivered assets
  min_clear_fraction: 0.2      # skip scenes with less clear water than this
  land_buffer_m: 30            # buffer the coastline inward to avoid shoreline glare

# Candidate detection (runs server-side in Earth Engine)
candidates:
  median_window: 25            # scenes used for the temporal median background
  threshold_sigma: 4.0         # loose on purpose — the classifier filters afterwards
  detection_band: "B8"        
  min_area_px: 1

# Classification (runs in Colab on exported patches)
classify:
  patch_size: 32               # pixels
  classes: ["vessel", "vessel_uncertain", "wake", "false_positive"]

# Aggregation
aggregate:
  grid_cell_km: 1.0
  normalise_by_clear_observations: true
  min_clear_observations: 5    # cells below this return NaN, not a misleading rate

# Held-out test areas — never train or tune on these
test_aoi:
  - "TBD — decide in week 1 and record in docs/decisions.md"